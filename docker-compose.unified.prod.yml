services:
  api:
    container_name: ${PROJECT_SLUG}-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: ${APP_PORT:-3000}
      PORT: ${APP_PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api/v1}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REDIS_URL: ${REDIS_URL}
      PASSWORD_RESET_OTP_SECRET: ${PASSWORD_RESET_OTP_SECRET}
      PASSWORD_RESET_OTP_TTL_SECONDS: ${PASSWORD_RESET_OTP_TTL_SECONDS:-600}
      PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_RESEND_COOLDOWN_SECONDS: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_MAX_SENDS_PER_HOUR: ${PASSWORD_RESET_MAX_SENDS_PER_HOUR:-5}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-600}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-نظام إدارة طلبات الصيانة}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CACHE_TTL: ${CACHE_TTL:-300}
      CACHE_MAX: ${CACHE_MAX:-100}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Asia/Riyadh}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-600}
      MEDIA_MAX_FILES: ${MEDIA_MAX_FILES:-3}
      MEDIA_MAX_INPUT_BYTES: ${MEDIA_MAX_INPUT_BYTES:-8388608}
      MEDIA_MAX_INPUT_PIXELS: ${MEDIA_MAX_INPUT_PIXELS:-40000000}
      MEDIA_FULL_MAX_EDGE: ${MEDIA_FULL_MAX_EDGE:-1600}
      MEDIA_THUMB_MAX_EDGE: ${MEDIA_THUMB_MAX_EDGE:-480}
      MEDIA_FULL_WEBP_QUALITY: ${MEDIA_FULL_WEBP_QUALITY:-78}
      MEDIA_THUMB_WEBP_QUALITY: ${MEDIA_THUMB_WEBP_QUALITY:-70}
    expose:
      - "${APP_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${APP_PORT:-3000}/api/v1/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network
      - platform-network
    labels:
      - traefik.docker.network=h11ghh0jcmv7eftiqv942awt
      - traefik.http.services.enginner-api.loadbalancer.server.port=3000

  frontend:
    container_name: ${PROJECT_SLUG}-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
        VITE_ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Asia/Riyadh}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network
      - platform-network
    labels:
      - traefik.docker.network=h11ghh0jcmv7eftiqv942awt
      - traefik.http.services.enginner-frontend.loadbalancer.server.port=80

networks:
  app-network:
    name: ${PROJECT_SLUG}-network
    driver: bridge
  platform-network:
    external: true
    name: platform-network
